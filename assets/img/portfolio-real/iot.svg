<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Internet of Things</title>
  <desc id="desc">Experimentos de electronica y automatizacion: semaforos y proyectos con microcontroladores</desc>
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001210"/>
      <stop offset="100%" stop-color="#013a38"/>
    </linearGradient>
    <linearGradient id="accentLine4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5fd6ce"/>
      <stop offset="100%" stop-color="#005451"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <circle cx="120" cy="480" r="150" fill="#5fd6ce" opacity="0.10"/>
  <circle cx="690" cy="110" r="130" fill="#5fd6ce" opacity="0.10"/>
  <rect x="0" y="0" width="800" height="8" fill="url(#accentLine4)"/>

  <!-- traffic light icon -->
  <g transform="translate(350,120)">
    <rect x="20" y="0" width="60" height="160" rx="14" fill="none" stroke="#ffffff" stroke-width="6"/>
    <circle cx="50" cy="34" r="14" fill="#5fd6ce"/>
    <circle cx="50" cy="80" r="14" fill="#ffffff" opacity="0.5"/>
    <circle cx="50" cy="126" r="14" fill="#ffffff" opacity="0.5"/>
    <line x1="50" y1="160" x2="50" y2="190" stroke="#ffffff" stroke-width="6"/>
  </g>

  <text x="400" y="360" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">Internet of Things</text>
  <text x="400" y="398" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#bfe8e4" text-anchor="middle">Semaforos y experimentos con microcontroladores</text>

  <g font-family="Roboto, Arial, sans-serif" font-size="14" fill="#013a38" text-anchor="middle">
    <rect x="300" y="440" width="90" height="30" rx="15" fill="#ffffff"/>
    <text x="345" y="460">Arduino</text>
    <rect x="400" y="440" width="100" height="30" rx="15" fill="#ffffff"/>
    <text x="450" y="460">Electronica</text>
  </g>
</svg>
