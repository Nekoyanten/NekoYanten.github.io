<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Market App</title>
  <desc id="desc">Tienda online fullstack con HTML, CSS, JavaScript, PHP y PostgreSQL</desc>
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#013a38"/>
      <stop offset="100%" stop-color="#001210"/>
    </linearGradient>
    <linearGradient id="accentLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005451"/>
      <stop offset="100%" stop-color="#5fd6ce"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <circle cx="700" cy="80" r="160" fill="#5fd6ce" opacity="0.10"/>
  <circle cx="60" cy="540" r="120" fill="#5fd6ce" opacity="0.10"/>
  <rect x="0" y="0" width="800" height="8" fill="url(#accentLine1)"/>

  <!-- shopping cart icon -->
  <g transform="translate(340,150)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M0 10 H24 L48 110 H150 L172 40 H50"/>
    <circle cx="70" cy="150" r="14" fill="#ffffff" stroke="none"/>
    <circle cx="140" cy="150" r="14" fill="#ffffff" stroke="none"/>
  </g>

  <text x="400" y="360" font-family="Poppins, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Market App</text>
  <text x="400" y="398" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#bfe8e4" text-anchor="middle">Tienda en linea fullstack (v1 &amp; v2)</text>

  <g font-family="Roboto, Arial, sans-serif" font-size="14" fill="#013a38" text-anchor="middle">
    <rect x="230" y="440" width="80" height="30" rx="15" fill="#ffffff"/>
    <text x="270" y="460">HTML/CSS</text>
    <rect x="320" y="440" width="90" height="30" rx="15" fill="#ffffff"/>
    <text x="365" y="460">JavaScript</text>
    <rect x="420" y="440" width="60" height="30" rx="15" fill="#ffffff"/>
    <text x="450" y="460">PHP</text>
    <rect x="490" y="440" width="100" height="30" rx="15" fill="#ffffff"/>
    <text x="540" y="460">PostgreSQL</text>
  </g>
</svg>
