<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">TiendaVirtualYanten</title>
  <desc id="desc">Tienda virtual construida con C# y ASP.NET Core</desc>
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#013a38"/>
      <stop offset="100%" stop-color="#001210"/>
    </linearGradient>
    <linearGradient id="accentLine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005451"/>
      <stop offset="100%" stop-color="#5fd6ce"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <circle cx="680" cy="120" r="150" fill="#5fd6ce" opacity="0.10"/>
  <circle cx="90" cy="500" r="130" fill="#5fd6ce" opacity="0.10"/>
  <rect x="0" y="0" width="800" height="8" fill="url(#accentLine3)"/>

  <!-- storefront icon -->
  <g transform="translate(320,140)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M0 40 L10 0 H150 L160 40 Z"/>
    <path d="M0 40 V150 H160 V40"/>
    <path d="M0 40 Q40 60 80 40 Q120 60 160 40"/>
    <rect x="60" y="90" width="40" height="60" fill="#ffffff" stroke="none"/>
  </g>

  <text x="400" y="360" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">TiendaVirtualYanten</text>
  <text x="400" y="398" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#bfe8e4" text-anchor="middle">Plataforma de tienda virtual</text>

  <g font-family="Roboto, Arial, sans-serif" font-size="14" fill="#013a38" text-anchor="middle">
    <rect x="280" y="440" width="50" height="30" rx="15" fill="#ffffff"/>
    <text x="305" y="460">C#</text>
    <rect x="340" y="440" width="120" height="30" rx="15" fill="#ffffff"/>
    <text x="400" y="460">ASP.NET Core</text>
    <rect x="470" y="440" width="60" height="30" rx="15" fill="#ffffff"/>
    <text x="500" y="460">MVC</text>
  </g>
</svg>
