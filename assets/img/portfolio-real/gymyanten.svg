<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">GymYanten</title>
  <desc id="desc">Aplicacion de gestion de gimnasio construida con C# y ASP.NET Core</desc>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001210"/>
      <stop offset="100%" stop-color="#013a38"/>
    </linearGradient>
    <linearGradient id="accentLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5fd6ce"/>
      <stop offset="100%" stop-color="#005451"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <circle cx="100" cy="100" r="150" fill="#5fd6ce" opacity="0.10"/>
  <circle cx="720" cy="500" r="140" fill="#5fd6ce" opacity="0.10"/>
  <rect x="0" y="0" width="800" height="8" fill="url(#accentLine2)"/>

  <!-- dumbbell icon -->
  <g transform="translate(300,140)" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.95">
    <line x1="20" y1="90" x2="180" y2="90"/>
    <rect x="0" y="60" width="24" height="60" rx="6" fill="#ffffff" stroke="none"/>
    <rect x="176" y="60" width="24" height="60" rx="6" fill="#ffffff" stroke="none"/>
    <rect x="-14" y="45" width="14" height="90" rx="4" fill="#ffffff" stroke="none"/>
    <rect x="200" y="45" width="14" height="90" rx="4" fill="#ffffff" stroke="none"/>
  </g>

  <text x="400" y="360" font-family="Poppins, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">GymYanten</text>
  <text x="400" y="398" font-family="Roboto, Arial, sans-serif" font-size="18" fill="#bfe8e4" text-anchor="middle">Gestion de gimnasio (miembros, planes, pagos)</text>

  <g font-family="Roboto, Arial, sans-serif" font-size="14" fill="#013a38" text-anchor="middle">
    <rect x="280" y="440" width="50" height="30" rx="15" fill="#ffffff"/>
    <text x="305" y="460">C#</text>
    <rect x="340" y="440" width="120" height="30" rx="15" fill="#ffffff"/>
    <text x="400" y="460">ASP.NET Core</text>
    <rect x="470" y="440" width="60" height="30" rx="15" fill="#ffffff"/>
    <text x="500" y="460">MVC</text>
  </g>
</svg>
